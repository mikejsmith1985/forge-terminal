# Forge Terminal - Smart Model Routing Configuration
# Restore Semantic Intelligence to Router

[router]
default_tier = "tier1"

[tiers.tier1]
name = "Standard"
model = "gpt-4o-mini"
description = "General queries and simple shell explanations."

[tiers.tier2]
name = "Advanced"
model = "gpt-4o"
description = "Multi-file analysis and architectural planning."

[tiers.tier3]
name = "Expert"
model = "claude-3-5-sonnet"
description = "Deep terminal debugging with full context vision support."

[context]
# Automatically include terminal context in prompts
include_cwd = true
include_git_branch = true
include_vision = true  # Include recent screenshot summaries

# Available placeholders for commands:
# {prompt}     - The user's input after "?"
# {cwd}        - Current working directory
# {branch}     - Git branch name
# {vision}     - Recent Forge Vision summary (if available)
# {file}       - Currently focused file (if detected)
