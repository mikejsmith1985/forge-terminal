# Forge Terminal - Smart Model Routing Configuration
# v3.7.0 - Forge Assist, Enhanced CLI Settings

[router]
default_tier = "tier1"
provider = "copilot"    # Primary provider: "copilot", "anthropic", "ollama"
auto_pilot = true       # Enable automatic model selection based on context

[budget]
# Monthly budget configuration (managed via ~/.forge/ledger.json)
# These are defaults - actual values stored in ledger
limit = 1500            # Monthly budget limit
unit = "credits"        # "credits" for Copilot, "usd" for Anthropic
renewal_day = 1         # Day of month to reset budget (1-28)

[tiers.tier1]
name = "Standard"
model = "gpt-4o-mini"
tools = ["base-shell"]
description = "Fast, cost-effective model for simple shell commands and explanations."

[tiers.tier2]
name = "Advanced"
model = "gpt-4o"
tools = ["fabric", "git-assistant"]
description = "High-reasoning model for complex architectural analysis and git workflows."

[tiers.tier3]
name = "Expert"
model = "claude-3-5-sonnet"
tools = ["compiler-expert", "vision-debugger"]
description = "State-of-the-art model for deep debugging, visual analysis, and creative code generation."

[features]
vision_enabled = true
context_injection = true

[context]
# Automatically include terminal context in prompts
include_cwd = true
include_git_branch = true
include_vision = true  # Include recent screenshot summaries
buffer_lines = 50      # Number of terminal lines to include

# Available placeholders for commands:
# {prompt}     - The user's input after "?"
# {cwd}        - Current working directory
# {branch}     - Git branch name
# {vision}     - Recent Forge Vision summary (if available)
# {file}       - Currently focused file (if detected)

[mcp]
# Forge MCP Server — allows AI tools (VS Code Copilot, Cursor, Claude Code, EZTest)
# to call Forge capabilities via the Model Context Protocol (JSON-RPC 2.0).
#
# Endpoint: POST http://<host>:<port>/api/mcp
# Auth:     Bearer token stored at ~/.forge/mcp-token (auto-generated on first start,
#           never stored here — keep secrets out of version control)
#
# To get your token:  cat ~/.forge/mcp-token
# To reset it:        rm ~/.forge/mcp-token  (a new one is generated on restart)

enabled = true

# Restrict which tools are exposed. Remove a tool name to disable it.
# Leave the list empty ([]) to expose ALL built-in tools.
allowed_tools = [
  "terminal_sessions",
  "terminal_execute",
  "terminal_read",
  "file_read",
  "file_write",
  "file_list",
  "task_submit",
  "workflow_status",
  "environment_detect",
  "environment_run",
]
