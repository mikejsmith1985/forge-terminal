name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-existing-release:
    name: Cleanup Existing Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Delete existing release if present
        continue-on-error: true
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Checking for existing release: $TAG_NAME"
          
          # Check if release exists
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG_NAME --jq '.id' 2>/dev/null || echo "")
          
          if [ -n "$RELEASE_ID" ]; then
            echo "Found existing release (ID: $RELEASE_ID). Deleting..."
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID
            echo "✅ Existing release deleted"
          else
            echo "No existing release found. Proceeding with new release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    name: Build and Release
    needs: cleanup-existing-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-amd64,windows-amd64
          - os: macos-latest
            targets: darwin-amd64,darwin-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Download Go Dependencies
        run: |
          go mod download
          go mod tidy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> $GITHUB_OUTPUT
          fi

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          echo "Frontend build complete. Checking output..."
          ls -R ../cmd/forge/web || echo "Output directory not found!"

      - name: Normalize asset directory case
        run: |
          # Ensure Assets directory is lowercase (case-sensitive for Go embed)
          cd cmd/forge/web
          if [ -d "Assets" ]; then
            mv Assets assets 2>/dev/null || true
          fi
          # Verify assets directory exists and contains files
          if [ ! -d "assets" ]; then
            echo "ERROR: assets directory not found after build!"
            ls -la
            exit 1
          fi
          # List what we're embedding
          echo "Embedding assets:"
          find . -type f -name "*.js" -o -name "*.css" | head -10

      - name: Build Linux and Windows Binaries
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p bin
          # -s strips symbol table, -w strips DWARF debug info
          # This reduces binary size and avoids AV false positives
          LDFLAGS="-s -w -X github.com/mikejsmith1985/forge-terminal/internal/updater.Version=${VERSION}"
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/forge-linux-amd64 ./cmd/forge
          # Windows AMD64 (GUI mode - no console window)
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS -H=windowsgui" -o bin/fterm.exe ./cmd/forge

      - name: Build macOS Binaries
        if: matrix.os == 'macos-latest'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p bin
          # -s strips symbol table, -w strips DWARF debug info
          LDFLAGS="-s -w -X github.com/mikejsmith1985/forge-terminal/internal/updater.Version=${VERSION}"
          
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/forge-darwin-amd64 ./cmd/forge
          # macOS ARM64
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/forge-darwin-arm64 ./cmd/forge

      - name: Ad-hoc Sign macOS Binaries (Development)
        if: matrix.os == 'macos-latest'
        run: |
          # Ad-hoc sign binaries for development
          # Production builds with Developer ID cert can be created by users via fork
          /usr/bin/codesign --force --options runtime -s - bin/forge-darwin-amd64
          /usr/bin/codesign --force --options runtime -s - bin/forge-darwin-arm64
          
          # Verify signatures
          codesign -v bin/forge-darwin-amd64
          codesign -v bin/forge-darwin-arm64
          
          echo ""
          echo "ℹ️  Ad-hoc signed for development."
          echo "For production builds with Developer ID: see docs/developer/MACOS_FORK_SETUP.md"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: bin/*
          retention-days: 1

  upload-release:
    name: Upload Release Assets
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: List Downloaded Artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lah artifacts/
          echo "Total file count: $(find artifacts -type f | wc -l)"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: false
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    name: Finalize Release
    needs: upload-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}