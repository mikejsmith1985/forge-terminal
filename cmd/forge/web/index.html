<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6c63ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Forge Terminal</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script type="module" crossorigin src="/assets/index.CTjLhXI7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index.B4iL86yi.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Mobile redirect — runs BEFORE the React bundle so phone users
      // never see the desktop SPA flash on screen.
      //
      // The desktop UI is intentionally not responsive (the terminal,
      // sidebar, and command cards all assume desktop-class width).
      // When a phone-class device hits the bare Forge URL we forward
      // them to /companion/, the purpose-built mobile PWA shipped in
      // the same binary.  The companion's own setup screen handles
      // the case where no token has been provisioned yet.
      //
      // Detection uses BOTH a coarse-pointer match (touch device) AND
      // a width threshold so a narrow desktop browser window does not
      // accidentally redirect.  ?desktop=1 forces the desktop SPA for
      // debugging.
      (function () {
        try {
          var here = new URL(window.location.href);
          if (here.searchParams.get('desktop') === '1') return;
          if (here.pathname.indexOf('/companion') === 0) return;
          var isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
          var isNarrowViewport = window.innerWidth < 768;
          if (isCoarsePointer && isNarrowViewport) {
            window.location.replace('/companion/' + here.search + here.hash);
          }
        } catch (_redirectFailure) {
          // Never block the desktop boot if the redirect logic throws.
        }
      })();
    </script>
  </body>
</html>
